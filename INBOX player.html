<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INBOX 630 · Game Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        body {
            background: #05050d;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 30px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff 0%, #7d96a6 50%, #050d1a 100%);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .header-brand h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 40%, #7d96a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-brand span {
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 4px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
        }

        .header-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
            display: inline-block;
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            background: rgba(10, 14, 23, 0.6);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px 12px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 12px 6px 12px;
            font-weight: 600;
        }

        .game-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: left;
            position: relative;
        }

        .game-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .game-btn.active {
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
            box-shadow: inset 3px 0 0 #ffffff;
        }

        .game-btn .icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-btn .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-btn .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        /* ===== PLAYER AREA ===== */
        .player {
            flex: 1;
            background: #0b0f17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .player .embed-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .player .embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .player .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
            padding: 40px;
        }

        .player .placeholder .big-icon {
            font-size: 72px;
            opacity: 0.3;
        }

        .player .placeholder h2 {
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
        }

        .player .placeholder p {
            font-size: 15px;
            max-width: 400px;
            line-height: 1.6;
            opacity: 0.6;
        }

        .player .placeholder .key-hint {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
        }

        .player .placeholder .key-hint kbd {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-family: inherit;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== SCROLLBAR ===== */
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
                padding: 12px 8px;
            }
            .game-btn {
                font-size: 12px;
                padding: 8px 10px;
            }
            .game-btn .icon {
                font-size: 16px;
                width: 24px;
            }
            .header-brand h1 {
                font-size: 17px;
            }
            .header {
                padding: 12px 16px;
            }
            .header-status {
                font-size: 11px;
                gap: 10px;
            }
        }

        @media (max-width: 520px) {
            .sidebar {
                width: 160px;
                padding: 8px 4px;
            }
            .game-btn {
                font-size: 11px;
                padding: 6px 8px;
                gap: 6px;
            }
            .game-btn .icon {
                font-size: 14px;
                width: 20px;
            }
            .game-btn .badge {
                display: none;
            }
            .header-brand h1 {
                font-size: 15px;
            }
            .header-brand span {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-brand">
            <div class="logo"></div>
            <div>
                <h1>INBOX 630 <span>· Game Player</span></h1>
            </div>
        </div>
        <div class="header-status">
            <span class="dot"></span>
            <span id="gameStatus">Select a game to start</span>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="main">

        <!-- ===== SIDEBAR ===== -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-label">🎮 Game Library</div>
            <!-- Games will be injected here by JS -->
        </nav>

        <!-- ===== PLAYER ===== -->
        <section class="player" id="player">
            <div class="placeholder" id="placeholder">
                <div class="big-icon">🎮</div>
                <h2>Ready to Play</h2>
                <p>Select a game from the sidebar to launch it instantly in the embedded player.</p>
                <div class="key-hint">
                    <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
                    <span><kbd>Enter</kbd> launch</span>
                </div>
            </div>
            <div class="embed-wrapper" id="embedWrapper" style="display:none;">
                <iframe id="gameFrame" src="" allowfullscreen></iframe>
            </div>
        </section>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        //  GAME DATA  –  same 14 titles from the main dashboard
        //  Each game has: name, url (embed link), and an icon emoji
        // ================================================================
        const GAMES = [
            { name: "Doom Classic", url: "https://pacman.live/", icon: "🔥" },
            { name: "Pac-Man Retro", url: "https://pacman.live/", icon: "🟡" },
            { name: "Retro Snake", url: "https://playsnake.org/", icon: "🐍" },
            { name: "Tetris Classic", url: "https://tetris.com/play-tetris", icon: "🧩" },
            { name: "Space Invaders", url: "https://freeinvaders.org/", icon: "👾" },
            { name: "Sonic Retro", url: "https://retrogames.cc", icon: "💨" },
            { name: "2048 Game", url: "https://play2048.co/", icon: "🔢" },
            { name: "Flappy Bird", url: "https://flappybird.io/", icon: "🐦" },
            { name: "Minesweeper", url: "https://minesweeperonline.com/", icon: "💣" },
            { name: "Retro Football", url: "https://pong-2.com/", icon: "⚽" },
            { name: "Pong Arcade", url: "https://pong-2.com/", icon: "🏓" },
            { name: "Asteroids 1979", url: "https://freeasteroids.org/", icon: "☄️" },
            { name: "Street Fighter II", url: "https://retrogames.cc", icon: "🥊" },
            { name: "Super Mario Retro", url: "https://supermarioplay.com/", icon: "🍄" }
        ];

        // ===== DOM REFS =====
        const sidebar = document.getElementById('sidebar');
        const player = document.getElementById('player');
        const placeholder = document.getElementById('placeholder');
        const embedWrapper = document.getElementById('embedWrapper');
        const gameFrame = document.getElementById('gameFrame');
        const gameStatus = document.getElementById('gameStatus');
        const toast = document.getElementById('toast');

        let activeIndex = -1;
        let toastTimer = null;

        // ===== RENDER SIDEBAR =====
        function renderSidebar() {
            // Keep the label
            const label = sidebar.querySelector('.sidebar-label');
            sidebar.innerHTML = '';
            sidebar.appendChild(label);

            GAMES.forEach((game, index) => {
                const btn = document.createElement('button');
                btn.className = 'game-btn';
                btn.dataset.index = index;
                btn.innerHTML = `
                    <span class="icon">${game.icon}</span>
                    <span class="name">${game.name}</span>
                    <span class="badge">play</span>
                `;
                btn.addEventListener('click', () => loadGame(index));
                btn.addEventListener('mouseenter', () => {
                    if (activeIndex !== index) {
                        // subtle preview, but we keep it clean
                    }
                });
                sidebar.appendChild(btn);
            });
        }

        // ===== LOAD GAME =====
        function loadGame(index) {
            const game = GAMES[index];
            if (!game) return;

            // Update active state
            const allBtns = sidebar.querySelectorAll('.game-btn');
            allBtns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            activeIndex = index;

            // Show embed, hide placeholder
            placeholder.style.display = 'none';
            embedWrapper.style.display = 'block';

            // Set iframe src
            gameFrame.src = game.url;

            // Update status
            gameStatus.textContent = `▶ Playing: ${game.name}`;

            // Toast
            showToast(`🎮 Launched: ${game.name}`);
        }

        // ===== TOAST =====
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ===== KEYBOARD NAVIGATION =====
        function navigateGames(direction) {
            if (GAMES.length === 0) return;
            let newIndex = activeIndex === -1 ? 0 : activeIndex + direction;
            newIndex = Math.max(0, Math.min(GAMES.length - 1, newIndex));

            // If no game is active, start from 0
            if (activeIndex === -1 && direction === 1) newIndex = 0;
            if (activeIndex === -1 && direction === -1) newIndex = GAMES.length - 1;

            // Scroll into view
            const btns = sidebar.querySelectorAll('.game-btn');
            if (btns[newIndex]) {
                btns[newIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                // Highlight but don't load yet – wait for Enter
                btns.forEach((b, i) => b.classList.toggle('active', i === newIndex));
                activeIndex = newIndex;
                gameStatus.textContent = `🎯 Selected: ${GAMES[newIndex].name}`;
            }
        }

        // ===== KEYBOARD EVENTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                navigateGames(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                navigateGames(-1);
            } else if (e.key === 'Enter' && activeIndex !== -1) {
                e.preventDefault();
                loadGame(activeIndex);
            } else if (e.key === 'Escape') {
                // Unload the game (go back to placeholder)
                if (embedWrapper.style.display !== 'none') {
                    embedWrapper.style.display = 'none';
                    placeholder.style.display = 'flex';
                    gameFrame.src = '';
                    gameStatus.textContent = 'Select a game to start';
                    activeIndex = -1;
                    const btns = sidebar.querySelectorAll('.game-btn');
                    btns.forEach(b => b.classList.remove('active'));
                    showToast('⏹️ Game closed');
                }
            }
        });

        // ===== INIT =====
        renderSidebar();

        // Auto-load the first game on startup (optional – you can comment this out)
        // loadGame(0);

        // Show a friendly welcome toast
        setTimeout(() => {
            showToast('🎮 Use ↑/↓ to browse, Enter to play, Escape to close');
        }, 600);
    </script>

</body>
</html>
